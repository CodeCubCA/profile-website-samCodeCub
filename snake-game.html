<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
        }

        .controls {
            text-align: center;
            margin-bottom: 10px;
        }

        .fullscreen-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 20px;
        }

        .fullscreen-btn:hover {
            background: #45a049;
        }

        canvas {
            border: 2px solid #fff;
            background: #111;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            display: none;
        }

        .game-over h2 {
            margin-bottom: 20px;
            color: #ff4444;
        }

        .restart-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        .restart-btn:hover {
            background: #45a049;
        }

        /* Fullscreen styles */
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen canvas {
            max-width: 90vw;
            max-height: 90vh;
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="controls">
            <p>Use WASD or Arrow Keys to move</p>
        </div>

        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <button class="fullscreen-btn" id="fullscreenBtn">Fullscreen</button>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const gameContainer = document.getElementById('gameContainer');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;

        function randomTilePosition() {
            return {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function createFood() {
            food = randomTilePosition();

            while (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                food = randomTilePosition();
            }
        }

        function drawGame() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff4444';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            ctx.fillStyle = '#4CAF50';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            createFood();
            gameRunning = true;
        }

        function gameLoop() {
            if (gameRunning) {
                moveSnake();
                drawGame();
            }
        }

        function changeDirection(event) {
            if (!gameRunning) return;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === 37 || keyPressed === 65) && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if ((keyPressed === 38 || keyPressed === 87) && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if ((keyPressed === 39 || keyPressed === 68) && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if ((keyPressed === 40 || keyPressed === 83) && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameContainer.classList.add('fullscreen');
                gameContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.textContent = 'Exit Fullscreen';

                canvas.width = Math.min(800, window.innerWidth * 0.9);
                canvas.height = Math.min(800, window.innerHeight * 0.9);
                canvas.width = Math.floor(canvas.width / gridSize) * gridSize;
                canvas.height = Math.floor(canvas.height / gridSize) * gridSize;
            } else {
                document.exitFullscreen();
                gameContainer.classList.remove('fullscreen');
                fullscreenBtn.textContent = 'Fullscreen';

                canvas.width = 400;
                canvas.height = 400;
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                gameContainer.classList.remove('fullscreen');
                fullscreenBtn.textContent = 'Fullscreen';
                canvas.width = 400;
                canvas.height = 400;
            }
        });

        document.addEventListener('keydown', changeDirection);
        restartBtn.addEventListener('click', resetGame);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        createFood();
        resetGame();
        setInterval(gameLoop, 100);
    </script>
</body>
</html>
